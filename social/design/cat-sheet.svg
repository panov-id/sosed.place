<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1100" viewBox="0 0 1600 1100">
  <!-- The cat from the third floor: the series host. Tortoiseshell, like the
       real cat of x1-lavka; flat shapes; half-closed eyes that judge. -->
  <defs>
    <style>
      .t { font-family: "Golos Text", sans-serif; }
      .h { font: 900 56px "Golos Text", sans-serif; letter-spacing: -.03em; fill: #1c140d; }
      .lbl { font: 500 38px "Caveat", cursive; fill: #1c140d; }
      .cap { font: 500 20px "JetBrains Mono", monospace; letter-spacing: .14em; fill: #6b5f4c; text-transform: uppercase; }
      .q { font: 400 25px "Golos Text", sans-serif; fill: #1c140d; }
      .base { fill: #2a221d; } .or { fill: #d9822b; } .cr { fill: #f2e3cc; } .pk { fill: #e9a0a0; }
      .ln { fill: none; stroke: #f2e3cc; stroke-width: 2.5; stroke-linecap: round; }
      .mouth { fill: none; stroke: #2a221d; stroke-width: 3.5; stroke-linecap: round; }
      .tail { fill: none; stroke: #2a221d; stroke-width: 28; stroke-linecap: round; }
      .tailor { fill: none; stroke: #d9822b; stroke-width: 28; stroke-linecap: round; }
    </style>

    <clipPath id="headclip"><path d="M-72,10 C-74,-40 -40,-62 0,-62 C40,-62 74,-40 72,10 C70,50 36,66 0,66 C-36,66 -70,50 -72,10Z"/></clipPath>

    <!-- head, centred on 0,0, about 150 wide -->
    <g id="head">
      <path class="base" d="M-64,-26 L-60,-100 L-16,-58Z"/>
      <path class="or" d="M64,-26 L60,-100 L16,-58Z"/>
      <path class="pk" d="M-56,-40 L-54,-84 L-28,-58Z"/>
      <path class="pk" d="M56,-40 L54,-84 L28,-58Z"/>
      <path class="base" d="M-72,10 C-74,-40 -40,-62 0,-62 C40,-62 74,-40 72,10 C70,50 36,66 0,66 C-36,66 -70,50 -72,10Z"/>
      <g clip-path="url(#headclip)">
        <path class="or" d="M8,-80 L100,-80 L100,30 C60,26 26,0 8,-80Z"/>
        <path class="or" d="M-100,20 C-60,10 -44,40 -40,80 L-100,80Z"/>
        <path class="cr" d="M-6,-70 L6,-70 L14,10 L-14,10Z"/>
      </g>
      <ellipse class="cr" cx="0" cy="32" rx="32" ry="23"/>
      <!-- eyes: green-gold, lids down to half: unimpressed -->
      <g>
        <ellipse cx="-28" cy="0" rx="15" ry="13" fill="#c9d64a"/>
        <ellipse cx="28" cy="0" rx="15" ry="13" fill="#c9d64a"/>
        <ellipse cx="-28" cy="2" rx="3.5" ry="10" fill="#120e0b"/>
        <ellipse cx="28" cy="2" rx="3.5" ry="10" fill="#120e0b"/>
        <path d="M-46,-1 L-10,-5 L-10,-16 L-46,-16Z" fill="#2a221d"/>
        <path d="M46,-1 L10,-5 L10,-16 L46,-16Z" fill="#d9822b"/>
        <path d="M-45,-1 L-11,-5" stroke="#120e0b" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M45,-1 L11,-5" stroke="#120e0b" stroke-width="3.5" stroke-linecap="round"/>
      </g>
      <path class="pk" d="M-8,20 L8,20 L0,29Z"/>
      <path class="mouth" d="M0,29 q-8,9 -16,3 M0,29 q8,9 16,3"/>
      <path class="ln" d="M-30,32 L-86,24 M-30,38 L-84,42 M30,32 L86,24 M30,38 L84,42"/>
    </g>

    <!-- sitting body, head sits on top at 0,-10 -->
    <g id="sit">
      <path class="base" d="M-58,40 C-96,130 -86,220 -44,246 L44,246 C86,220 96,130 58,40Z"/>
      <path class="or" d="M20,50 C60,70 90,150 80,210 C60,200 40,140 20,50Z"/>
      <path class="cr" d="M-26,56 C-40,120 -30,200 0,236 C30,200 40,120 26,56Z"/>
      <ellipse class="cr" cx="-26" cy="244" rx="24" ry="13"/>
      <ellipse class="cr" cx="26" cy="244" rx="24" ry="13"/>
    </g>
  </defs>

  <rect width="1600" height="1100" fill="#efe4d2"/>
  <text x="70" y="100" class="h">КОТ С ТРЕТЬЕГО</text>
  <text x="72" y="140" class="cap">sosed · ведущий серии · лист персонажа v1 · 23.09.2026</text>

  <!-- 1 judges -->
  <g transform="translate(230 420)">
    <path class="tail" d="M58,232 C130,240 150,170 112,140"/>
    <path class="tailor" d="M112,140 C104,132 96,134 92,140"/>
    <use href="#sit"/>
    <use href="#head" transform="translate(0 -10)"/>
  </g>
  <text x="230" y="740" class="lbl" text-anchor="middle">1 · судит</text>
  <text x="230" y="775" class="cap" text-anchor="middle">обложки, ответы</text>

  <!-- 2 took the bench -->
  <g transform="translate(610 560)">
    <rect x="-170" y="60" width="340" height="22" rx="4" fill="#8a5a36"/>
    <rect x="-170" y="30" width="340" height="18" rx="4" fill="#a06a40"/>
    <rect x="-150" y="82" width="14" height="80" fill="#3a2a20"/><rect x="136" y="82" width="14" height="80" fill="#3a2a20"/>
    <path class="tail" d="M120,20 C170,30 180,90 160,130"/>
    <path class="base" d="M-120,-6 C-120,-50 120,-56 136,-8 C146,24 110,36 0,36 C-90,36 -120,26 -120,-6Z"/>
    <path class="or" d="M20,-44 C70,-50 120,-40 130,-10 C90,-2 50,-20 20,-44Z"/>
    <path class="cr" d="M-100,20 C-60,34 40,36 90,30 C60,40 -60,40 -100,20Z"/>
    <ellipse class="cr" cx="-128" cy="30" rx="30" ry="12"/>
    <use href="#head" transform="translate(-116 -52) rotate(-8) scale(.92)"/>
  </g>
  <text x="610" y="740" class="lbl" text-anchor="middle">2 · занял лавку</text>
  <text x="610" y="775" class="cap" text-anchor="middle">«лавка занята»</text>

  <!-- 3 reads the notes -->
  <g transform="translate(990 520)">
    <use href="#head" transform="translate(0 -30)"/>
    <rect x="-150" y="20" width="300" height="150" fill="#ffe066" transform="rotate(-3)"/>
    <text x="-122" y="80" class="lbl" transform="rotate(-3)">Кто на лавку</text>
    <text x="-122" y="124" class="lbl" transform="rotate(-3)">в пять?</text>
    <ellipse class="cr" cx="-60" cy="22" rx="26" ry="14"/>
    <ellipse class="cr" cx="60" cy="18" rx="26" ry="14"/>
  </g>
  <text x="990" y="740" class="lbl" text-anchor="middle">3 · читает записки</text>
  <text x="990" y="775" class="cap" text-anchor="middle">механика, доска</text>

  <!-- 4 off on business: tail up -->
  <g transform="translate(1370 420)">
    <path class="tail" d="M58,220 C120,200 100,100 132,50"/>
    <path class="tailor" d="M132,50 C138,36 126,24 116,34"/>
    <use href="#sit"/>
    <use href="#head" transform="translate(0 -10) rotate(10)"/>
  </g>
  <text x="1370" y="740" class="lbl" text-anchor="middle">4 · идёт по делам</text>
  <text x="1370" y="775" class="cap" text-anchor="middle">финал, «садись рядом»</text>

  <!-- palette -->
  <g transform="translate(70 830)">
    <rect width="54" height="54" fill="#2a221d"/><rect x="64" width="54" height="54" fill="#d9822b"/>
    <rect x="128" width="54" height="54" fill="#f2e3cc" stroke="#cbbba2"/><rect x="192" width="54" height="54" fill="#c9d64a"/>
    <rect x="256" width="54" height="54" fill="#e9a0a0"/>
    <text x="0" y="86" class="cap">черепаховая, как настоящий кот из x1 · глаза не круглые — полуприкрыты</text>
  </g>

  <text x="70" y="970" class="q">1. Характер: снисходительный «я тут главный» — или добрее?</text>
  <text x="70" y="1008" class="q">2. Плоская заливка без контура — или живой штрих маркером, как на доске?</text>
  <text x="70" y="1046" class="q">3. Говорит ли кот (пузыри с репликами) — или только смотрит, а текст рядом?</text>
</svg>
