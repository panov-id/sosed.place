      <text x="1316" y="46" class="mono" style="fill:#fff6f0" text-anchor="end">design/interface/15-legal.svg</text>
      <text x="1316" y="74" class="mono" style="fill:#fff6f0" text-anchor="end">×2 · обе темы · ../../docs/15-legal-documents_RU.md</text>
    </g>
    <g transform="translate(48,184)">
