      <rect x="16" y="284" width="342" height="60" rx="16" fill="#241c14" stroke="#3a2e20" stroke-width="1"/>
      <text x="32" y="320" class="msg">Правила сообщества</text>
      <text x="342" y="321" class="disp" font-size="16" style="fill:#bd4b2a" text-anchor="end">→</text>
    </g>
    </g>
