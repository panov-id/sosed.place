<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1396" viewBox="0 0 1440 1396" font-family="Golos Text, system-ui, sans-serif">
  <title>сосед — экран 6, мэтч и чат</title>
  <desc>Взаимный лайк открывает чат и показывает, на чём именно совпало. Следующий лайк не заводит второй чат. Нарисовано по ../../docs/06-*_RU.md; цвета сняты с landing/index.html.</desc>
  <style>
    @import url("../../landing/fonts.css");
    /* Colour lives in style, never in a fill attribute: a class outranks the
       attribute, so a per-element fill="…" is thrown away and the label is
       painted in the class colour on top of its own ground. */
    .disp  { font-weight: 800; letter-spacing: -0.03em; fill: #f0e7dc; }
    .body  { font-size: 13px; font-weight: 500; fill: #f0e7dc; }
    .msg   { font-size: 14px; font-weight: 500; fill: #f0e7dc; }
    .small { font-size: 11px; font-weight: 500; fill: #f0e7dc; }
    .muted { font-size: 12px; font-weight: 500; fill: #ab9d88; }
    .mono  { font-family: ui-monospace, SF Mono, Menlo, Consolas, monospace;
             font-size: 10px; fill: #ab9d88; }
    .brow  { font-family: ui-monospace, SF Mono, Menlo, Consolas, monospace;
             font-size: 10px; letter-spacing: 2.2px; fill: #ab9d88; font-weight: 600; }
    .warn  { font-size: 11px; font-weight: 600; fill: #e0973a; }
    /* neighbro's prototype sets a live message's timer in the accent, uppercase
       and wide. sosed has no such thing — there the timer is a plain caption. */
    .timer { font-family: ui-monospace, SF Mono, Menlo, Consolas, monospace;
             font-size: 10px; letter-spacing: 1.4px; fill: #ab9d88; font-weight: 600; }
  </style>
  <rect x="0" y="0" width="1440" height="1396" rx="0" fill="#0d0b0a"/>
    <g transform="translate(48,40)">
      <rect x="0" y="0" width="1344" height="104" rx="16" fill="#bd4b2a"/>
      <text x="28" y="46" class="disp" font-size="30" style="fill:#fff6f0">Экран 6. мэтч и чат</text>
      <text x="28" y="74" class="body" style="fill:#fff6f0">Взаимный лайк открывает чат и показывает, на чём именно совпало. Следующий лайк не заводит второй чат.</text>
      <text x="1316" y="46" class="mono" style="fill:#fff6f0" text-anchor="end">design/interface/06-match-and-chat.svg</text>
      <text x="1316" y="74" class="mono" style="fill:#fff6f0" text-anchor="end">по ../../docs/06-match-and-chat_RU.md</text>
    </g>
    <g transform="translate(48,184)">
      <text x="0" y="16" class="disp" font-size="19">Телефон · 390 × 844</text>
      <line x1="0" y1="26" x2="1344" y2="26" stroke="#3a2e20" stroke-width="1"/>
      <text x="0" y="48" class="muted">Истинная геометрия, без масштаба.</text>
    </g>
  <g transform="translate(48,256)">
    <text x="0" y="0" class="brow">МЭТЧ</text>
    <rect x="0" y="14" width="390" height="844" rx="46" fill="#17130f" stroke="#3a2e20" stroke-width="1"/>
    <g transform="translate(8,22)">
      <rect x="0" y="0" width="374" height="828" rx="35" fill="#0d0b0a"/>
      <text x="187" y="30" class="mono" text-anchor="middle">9:41</text>
      <text x="187" y="200" class="brow" text-anchor="middle">ВЗАИМНО</text>
      <text x="187" y="260" class="disp" font-size="34" text-anchor="middle">Совпало</text>
      <text x="187" y="300" class="muted" text-anchor="middle">на этом сообщении</text>
      <rect x="16" y="340" width="342" height="98" rx="16" fill="#17130f" stroke="#3a2e20" stroke-width="1"/>
      <text x="32" y="364" class="brow">ЧИСТЫЕ ПРУДЫ · 29</text>
      <text x="32" y="388" class="msg">Кто-нибудь ещё слышал этот</text>
      <text x="32" y="408" class="msg">оркестр во дворе в семь утра?</text>
      <text x="32" y="430" class="mono">14:32</text>
      <text x="187" y="500" class="mono" text-anchor="middle">чат уже открыт</text>
      <rect x="16" y="700" width="342" height="44" rx="12" fill="#bd4b2a"/>
      <text x="187.0" y="728" class="small" style="fill:#fff6f0;font-weight:700" text-anchor="middle">Написать</text>
    </g>
  </g>
  <g transform="translate(525,256)">
    <text x="0" y="0" class="brow">ЛАЙК ПОСЛЕ МЭТЧА</text>
    <rect x="0" y="14" width="390" height="844" rx="46" fill="#17130f" stroke="#3a2e20" stroke-width="1"/>
    <g transform="translate(8,22)">
      <rect x="0" y="0" width="374" height="828" rx="35" fill="#0d0b0a"/>
      <text x="187" y="30" class="mono" text-anchor="middle">9:41</text>
      <text x="20" y="64" class="disp" font-size="20">ЧИСТЫЕ ПРУДЫ · 29</text>
      <text x="20" y="84" class="mono">приватно</text>
      <line x1="0" y1="104" x2="374" y2="104" stroke="#3a2e20" stroke-width="1"/>
      <rect x="16" y="140" width="300" height="64" rx="16" fill="#241c14" stroke="#3a2e20" stroke-width="1"/>
      <text x="32" y="166" class="msg">Слышал. Думал, это у меня в голове.</text>
      <text x="32" y="188" class="mono">14:33</text>
      <rect x="98" y="216" width="260" height="64" rx="16" fill="#bd4b2a"/>
      <text x="114" y="242" class="msg" style="fill:#fff6f0">Значит, нас двое.</text>
      <text x="114" y="264" class="mono" style="fill:#fff6f0">14:35 · ДОСТАВЛЕНО</text>
      <rect x="16" y="300" width="342" height="70" rx="16" fill="#241c14" stroke="#3a2e20" stroke-width="1"/>
      <path d="M32 322 a5 5 0 0 1 6 -3 a5 5 0 0 1 6 3 q0 6 -6 9 q-6 -3 -6 -9 z" fill="#bd4b2a"/>
      <text x="56" y="328" class="small">лайкнули ещё одно ваше сообщение</text>
      <text x="32" y="354" class="mono">«Продаю велосипед, стоял год на балконе»</text>
      <text x="16" y="400" class="mono">второй лайк не открывает второй чат —</text>
      <text x="16" y="418" class="mono">он приходит сюда, уведомлением</text>
      <rect x="16" y="700" width="278" height="44" rx="12" fill="#241c14" stroke="#3a2e20" stroke-width="1"/>
      <text x="32" y="728" class="small" style="fill:#ab9d88">написать…</text>
      <circle cx="332" cy="722" r="22" fill="#bd4b2a"/>
      <text x="332" y="729" class="disp" font-size="20" style="fill:#fff6f0" text-anchor="middle">↑</text>
    </g>
  </g>
    <g transform="translate(48,1160)">
      <text x="0" y="16" class="disp" font-size="19">Открытое, из описания экрана</text>
      <line x1="0" y1="26" x2="1344" y2="26" stroke="#3a2e20" stroke-width="1"/>
    </g>
    <g transform="translate(48,1200)">
      <rect x="0" y="0" width="1344" height="112" rx="16" fill="#17130f" stroke="#e0973a" stroke-width="2"/>
      <text x="24" y="34" class="warn">Два вопроса описание оставляет открытыми.</text>
      <text x="24" y="58" class="body">Вид анимации мэтча не определён — здесь показано только её содержание.</text>
      <text x="24" y="82" class="body">Формат уведомления о лайке внутри чата не определён: текст, карточка или иконка.</text>
    </g>
    <g transform="translate(48,1336)">
      <rect x="0" y="-8" width="1344" height="36" rx="10" fill="#241c14" stroke="#3a2e20" stroke-width="1"/>
      <text x="24" y="16" class="mono">Цвета — landing/index.html, шрифт — landing/fonts.css. Брат: neighbro.place/design/interface/</text>
    </g>
</svg>
