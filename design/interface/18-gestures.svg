<svg xmlns="http://www.w3.org/2000/svg" width="2880" height="4576" viewBox="0 0 1440 2288" font-family="Golos Text, system-ui, sans-serif">
  <title>сосед — экран 18, жесты</title>
  <desc>Свайп по карточке, долгое нажатие и то, что тянут сверху. Нарисовано положением, а не стрелками на пустом месте. Обе темы. Нарисовано по ../../docs/03-feed-screen_RU.md; цвета сняты с landing/index.html.</desc>
  <style>
    @import url("../../landing/fonts.css");
    /* Colour lives in style, never in a fill attribute: a class outranks the
       attribute, so a per-element fill="…" is thrown away and the label is
       painted in the class colour on top of its own ground. */
    .disp  { font-weight: 800; letter-spacing: -0.03em; fill: #f0e7dc; }
    .body  { font-size: 13px; font-weight: 500; fill: #f0e7dc; }
    .msg   { font-size: 14px; font-weight: 500; fill: #f0e7dc; }
    .small { font-size: 11px; font-weight: 500; fill: #f0e7dc; }
    .muted { font-size: 12px; font-weight: 500; fill: #ab9d88; }
    .mono  { font-family: ui-monospace, SF Mono, Menlo, Consolas, monospace;
             font-size: 10px; fill: #ab9d88; }
    .brow  { font-family: ui-monospace, SF Mono, Menlo, Consolas, monospace;
             font-size: 10px; letter-spacing: 2.2px; fill: #ab9d88; font-weight: 600; }
    .warn  { font-size: 11px; font-weight: 600; fill: #e0973a; }
    .timer { font-family: ui-monospace, SF Mono, Menlo, Consolas, monospace;
             font-size: 10px; letter-spacing: 1.4px; fill: #ab9d88; font-weight: 600; }
    /* The same drawing again, on the light ground. Only the values differ — the
       geometry, the wording and the layout are one thing drawn twice. */
    .on-light .disp  { font-weight: 800; letter-spacing: -0.03em; fill: #1c140d; }
    .on-light .body  { font-size: 13px; font-weight: 500; fill: #1c140d; }
    .on-light .msg   { font-size: 14px; font-weight: 500; fill: #1c140d; }
    .on-light .small { font-size: 11px; font-weight: 500; fill: #1c140d; }
    .on-light .muted { font-size: 12px; font-weight: 500; fill: #655847; }
    .on-light .mono  { font-family: ui-monospace, SF Mono, Menlo, Consolas, monospace;
             font-size: 10px; fill: #655847; }
    .on-light .brow  { font-family: ui-monospace, SF Mono, Menlo, Consolas, monospace;
             font-size: 10px; letter-spacing: 2.2px; fill: #655847; font-weight: 600; }
    .on-light .warn  { font-size: 11px; font-weight: 600; fill: #8a5200; }
    .on-light .timer { font-family: ui-monospace, SF Mono, Menlo, Consolas, monospace;
             font-size: 10px; letter-spacing: 1.4px; fill: #655847; font-weight: 600; }
  </style>
