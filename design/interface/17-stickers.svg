<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1420" viewBox="0 0 1440 1420" font-family="Golos Text, system-ui, sans-serif">
  <title>сосед — экран 17, стикеры</title>
  <desc>За пределами альфы. Фиксированный каталог из админ-панели, покупка за внутренний баланс. Нарисовано по ../../docs/17-*_RU.md; цвета сняты с landing/index.html.</desc>
  <style>
    @import url("../../landing/fonts.css");
    /* Colour lives in style, never in a fill attribute: a class outranks the
       attribute, so a per-element fill="…" is thrown away and the label is
       painted in the class colour on top of its own ground. */
    .disp  { font-weight: 800; letter-spacing: -0.03em; fill: #f0e7dc; }
    .body  { font-size: 13px; font-weight: 500; fill: #f0e7dc; }
    .msg   { font-size: 14px; font-weight: 500; fill: #f0e7dc; }
    .small { font-size: 11px; font-weight: 500; fill: #f0e7dc; }
    .muted { font-size: 12px; font-weight: 500; fill: #ab9d88; }
    .mono  { font-family: ui-monospace, SF Mono, Menlo, Consolas, monospace;
             font-size: 10px; fill: #ab9d88; }
    .brow  { font-family: ui-monospace, SF Mono, Menlo, Consolas, monospace;
             font-size: 10px; letter-spacing: 2.2px; fill: #ab9d88; font-weight: 600; }
    .warn  { font-size: 11px; font-weight: 600; fill: #e0973a; }
    /* neighbro's prototype sets a live message's timer in the accent, uppercase
       and wide. sosed has no such thing — there the timer is a plain caption. */
    .timer { font-family: ui-monospace, SF Mono, Menlo, Consolas, monospace;
             font-size: 10px; letter-spacing: 1.4px; fill: #ab9d88; font-weight: 600; }
  </style>
  <rect x="0" y="0" width="1440" height="1420" rx="0" fill="#0d0b0a"/>
    <g transform="translate(48,40)">
      <rect x="0" y="0" width="1344" height="104" rx="16" fill="#bd4b2a"/>
      <text x="28" y="46" class="disp" font-size="30" style="fill:#fff6f0">Экран 17. стикеры</text>
      <text x="28" y="74" class="body" style="fill:#fff6f0">За пределами альфы. Фиксированный каталог из админ-панели, покупка за внутренний баланс.</text>
      <text x="1316" y="46" class="mono" style="fill:#fff6f0" text-anchor="end">design/interface/17-stickers.svg</text>
      <text x="1316" y="74" class="mono" style="fill:#fff6f0" text-anchor="end">по ../../docs/17-stickers_RU.md</text>
    </g>
    <g transform="translate(48,184)">
      <text x="0" y="16" class="disp" font-size="19">Телефон · 390 × 844</text>
      <line x1="0" y1="26" x2="1344" y2="26" stroke="#3a2e20" stroke-width="1"/>
      <text x="0" y="48" class="muted">Истинная геометрия, без масштаба.</text>
    </g>
  <g transform="translate(48,256)">
    <text x="0" y="0" class="brow">КАТАЛОГ</text>
    <rect x="0" y="14" width="390" height="844" rx="46" fill="#17130f" stroke="#3a2e20" stroke-width="1"/>
    <g transform="translate(8,22)">
      <rect x="0" y="0" width="374" height="828" rx="35" fill="#0d0b0a"/>
      <text x="187" y="30" class="mono" text-anchor="middle">9:41</text>
      <text x="20" y="64" class="disp" font-size="20">стикеры</text>
      <text x="20" y="84" class="mono">баланс: 40</text>
      <line x1="0" y1="104" x2="374" y2="104" stroke="#3a2e20" stroke-width="1"/>
      <rect x="16" y="140" width="100" height="100" rx="16" fill="#241c14" stroke="#3a2e20" stroke-width="1"/>
      <circle cx="66" cy="182" r="22" fill="#bd4b2a" opacity="0.25"/>
      <text x="66" y="226" class="mono" text-anchor="middle">4 ⌁</text>
      <rect x="132" y="140" width="100" height="100" rx="16" fill="#241c14" stroke="#3a2e20" stroke-width="1"/>
      <circle cx="182" cy="182" r="22" fill="#bd4b2a" opacity="0.37"/>
      <text x="182" y="226" class="mono" text-anchor="middle">5 ⌁</text>
      <rect x="248" y="140" width="100" height="100" rx="16" fill="#241c14" stroke="#3a2e20" stroke-width="1"/>
      <circle cx="298" cy="182" r="22" fill="#bd4b2a" opacity="0.49"/>
      <text x="298" y="226" class="mono" text-anchor="middle">6 ⌁</text>
      <rect x="16" y="256" width="100" height="100" rx="16" fill="#241c14" stroke="#3a2e20" stroke-width="1"/>
      <circle cx="66" cy="298" r="22" fill="#bd4b2a" opacity="0.37"/>
      <text x="66" y="342" class="mono" text-anchor="middle">7 ⌁</text>
      <rect x="132" y="256" width="100" height="100" rx="16" fill="#241c14" stroke="#3a2e20" stroke-width="1"/>
      <circle cx="182" cy="298" r="22" fill="#bd4b2a" opacity="0.49"/>
      <text x="182" y="342" class="mono" text-anchor="middle">8 ⌁</text>
      <rect x="248" y="256" width="100" height="100" rx="16" fill="#241c14" stroke="#3a2e20" stroke-width="1"/>
      <circle cx="298" cy="298" r="22" fill="#bd4b2a" opacity="0.61"/>
      <text x="298" y="342" class="mono" text-anchor="middle">9 ⌁</text>
      <rect x="16" y="372" width="100" height="100" rx="16" fill="#241c14" stroke="#3a2e20" stroke-width="1"/>
      <circle cx="66" cy="414" r="22" fill="#bd4b2a" opacity="0.49"/>
      <text x="66" y="458" class="mono" text-anchor="middle">10 ⌁</text>
      <rect x="132" y="372" width="100" height="100" rx="16" fill="#241c14" stroke="#3a2e20" stroke-width="1"/>
      <circle cx="182" cy="414" r="22" fill="#bd4b2a" opacity="0.61"/>
      <text x="182" y="458" class="mono" text-anchor="middle">11 ⌁</text>
      <rect x="248" y="372" width="100" height="100" rx="16" fill="#241c14" stroke="#3a2e20" stroke-width="1"/>
      <circle cx="298" cy="414" r="22" fill="#bd4b2a" opacity="0.25"/>
      <text x="298" y="458" class="mono" text-anchor="middle">12 ⌁</text>
      <rect x="16" y="500" width="342" height="128" rx="16" fill="#17130f" stroke="#3a2e20" stroke-width="1"/>
      <text x="32" y="528" class="brow">ЧТО ЭТО НЕ</text>
      <text x="32" y="554" class="mono">не вложение произвольной картинки —</text>
      <text x="32" y="572" class="mono">каталог фиксирован и правится из панели</text>
      <text x="32" y="598" class="mono">обычные сообщения остаются текстовыми</text>
      <rect x="16" y="700" width="342" height="44" rx="12" fill="#bd4b2a"/>
      <text x="187.0" y="728" class="small" style="fill:#fff6f0;font-weight:700" text-anchor="middle">Купить за 6</text>
    </g>
  </g>
    <g transform="translate(48,1160)">
      <text x="0" y="16" class="disp" font-size="19">Открытое, из описания экрана</text>
      <line x1="0" y1="26" x2="1344" y2="26" stroke="#3a2e20" stroke-width="1"/>
    </g>
    <g transform="translate(48,1200)">
      <rect x="0" y="0" width="1344" height="136" rx="16" fill="#17130f" stroke="#e0973a" stroke-width="2"/>
      <text x="24" y="34" class="warn">Три вопроса описание оставляет открытыми.</text>
      <text x="24" y="58" class="body">Откуда открывается каталог — не определено.</text>
      <text x="24" y="82" class="body">Цены не определены — числа на чертеже условны.</text>
      <text x="24" y="106" class="body">Сколько стикеров помещается в одно сообщение — не определено.</text>
    </g>
    <g transform="translate(48,1360)">
      <rect x="0" y="-8" width="1344" height="36" rx="10" fill="#241c14" stroke="#3a2e20" stroke-width="1"/>
      <text x="24" y="16" class="mono">Цвета — landing/index.html, шрифт — landing/fonts.css. Брат: neighbro.place/design/interface/</text>
    </g>
</svg>
