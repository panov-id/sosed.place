      <text x="1316" y="46" class="mono" style="fill:#fff6f0" text-anchor="end">design/interface/04-composer.svg</text>
      <text x="1316" y="74" class="mono" style="fill:#fff6f0" text-anchor="end">×2 · обе темы · ../../docs/04-post-composer_RU.md</text>
