<svg xmlns="http://www.w3.org/2000/svg" width="2880" height="4576" viewBox="0 0 1440 2288" font-family="Golos Text, system-ui, sans-serif">
  <title>сосед — экран 16, приглашения</title>
  <desc>За пределами альфы. Персональная ссылка; поощрение получают оба — и позвавший, и пришедший. Обе темы. Нарисовано по ../../docs/16-referral_RU.md; цвета сняты с landing/index.html.</desc>
  <style>
    @import url("../../landing/fonts.css");
    /* Colour lives in style, never in a fill attribute: a class outranks the
       attribute, so a per-element fill="…" is thrown away and the label is
       painted in the class colour on top of its own ground. */
    .disp  { font-weight: 800; letter-spacing: -0.03em; fill: #f0e7dc; }
    .body  { font-size: 13px; font-weight: 500; fill: #f0e7dc; }
    .msg   { font-size: 14px; font-weight: 500; fill: #f0e7dc; }
    .small { font-size: 11px; font-weight: 500; fill: #f0e7dc; }
    .muted { font-size: 12px; font-weight: 500; fill: #ab9d88; }
    .mono  { font-family: ui-monospace, SF Mono, Menlo, Consolas, monospace;
             font-size: 10px; fill: #ab9d88; }
    .brow  { font-family: ui-monospace, SF Mono, Menlo, Consolas, monospace;
             font-size: 10px; letter-spacing: 2.2px; fill: #ab9d88; font-weight: 600; }
    .warn  { font-size: 11px; font-weight: 600; fill: #e0973a; }
    .timer { font-family: ui-monospace, SF Mono, Menlo, Consolas, monospace;
             font-size: 10px; letter-spacing: 1.4px; fill: #ab9d88; font-weight: 600; }
    /* The same drawing again, on the light ground. Only the values differ — the
       geometry, the wording and the layout are one thing drawn twice. */
    .on-light .disp  { font-weight: 800; letter-spacing: -0.03em; fill: #1c140d; }
    .on-light .body  { font-size: 13px; font-weight: 500; fill: #1c140d; }
    .on-light .msg   { font-size: 14px; font-weight: 500; fill: #1c140d; }
    .on-light .small { font-size: 11px; font-weight: 500; fill: #1c140d; }
    .on-light .muted { font-size: 12px; font-weight: 500; fill: #655847; }
    .on-light .mono  { font-family: ui-monospace, SF Mono, Menlo, Consolas, monospace;
             font-size: 10px; fill: #655847; }
    .on-light .brow  { font-family: ui-monospace, SF Mono, Menlo, Consolas, monospace;
             font-size: 10px; letter-spacing: 2.2px; fill: #655847; font-weight: 600; }
    .on-light .warn  { font-size: 11px; font-weight: 600; fill: #8a5200; }
    .on-light .timer { font-family: ui-monospace, SF Mono, Menlo, Consolas, monospace;
             font-size: 10px; letter-spacing: 1.4px; fill: #655847; font-weight: 600; }
  </style>
  <rect x="0" y="0" width="1440" height="2288" rx="0" fill="#0d0b0a"/>
    <g transform="translate(48,40)">
      <rect x="0" y="0" width="1344" height="104" rx="16" fill="#bd4b2a"/>
      <text x="28" y="46" class="disp" font-size="30" style="fill:#fff6f0">Экран 16. приглашения</text>
      <text x="28" y="74" class="body" style="fill:#fff6f0">За пределами альфы. Персональная ссылка; поощрение получают оба — и позвавший, и пришедший.</text>
      <text x="1316" y="46" class="mono" style="fill:#fff6f0" text-anchor="end">design/interface/16-referral.svg</text>
      <text x="1316" y="74" class="mono" style="fill:#fff6f0" text-anchor="end">×2 · обе темы · ../../docs/16-referral_RU.md</text>
    </g>
    <g transform="translate(48,184)">
      <text x="0" y="16" class="disp" font-size="19">ТЁМНАЯ · ПО УМОЛЧАНИЮ</text>
      <line x1="0" y1="26" x2="1344" y2="26" stroke="#3a2e20" stroke-width="1"/>
    </g>
  <g transform="translate(48,256)">
    <text x="0" y="0" class="brow">ПРИГЛАСИТЬ</text>
    <rect x="0" y="14" width="390" height="844" rx="46" fill="#17130f" stroke="#3a2e20" stroke-width="1"/>
    <g transform="translate(8,22)">
      <rect x="0" y="0" width="374" height="828" rx="35" fill="#0d0b0a"/>
      <text x="187" y="30" class="mono" text-anchor="middle">9:41</text>
      <text x="20" y="64" class="disp" font-size="20">пригласить</text>
      <text x="20" y="84" class="mono">за пределами альфы</text>
      <line x1="0" y1="104" x2="374" y2="104" stroke="#3a2e20" stroke-width="1"/>
      <rect x="16" y="140" width="342" height="96" rx="16" fill="#241c14" stroke="#3a2e20" stroke-width="1"/>
      <text x="32" y="168" class="brow">ВАША ССЫЛКА</text>
      <text x="32" y="200" class="msg">sosed.place/i/8f4c1a</text>
      <rect x="16" y="256" width="342" height="44" rx="12" fill="#bd4b2a"/>
      <text x="187.0" y="284" class="small" style="fill:#fff6f0;font-weight:700" text-anchor="middle">Скопировать</text>
      <rect x="16" y="330" width="342" height="140" rx="16" fill="#17130f" stroke="#3a2e20" stroke-width="1"/>
      <text x="32" y="358" class="brow">ЧТО ПОЛУЧАЮТ ОБА</text>
      <text x="32" y="386" class="msg">Приглашённый заходит по ссылке</text>
      <text x="32" y="406" class="msg">и регистрируется — поощрение</text>
      <text x="32" y="426" class="msg">получают оба.</text>
      <text x="32" y="456" class="warn">размер поощрения не определён</text>
      <text x="16" y="520" class="mono">не входит в day0 и альфу — механика описана,</text>
      <text x="16" y="538" class="mono">чтобы её было куда встроить, когда придёт время</text>
    </g>
  </g>
    <g transform="translate(48,1194)">
      <text x="0" y="16" class="disp" font-size="19">СВЕТЛАЯ</text>
      <line x1="0" y1="26" x2="1344" y2="26" stroke="#221a12" stroke-width="1"/>
    </g>
  <rect x="0" y="1238" width="1440" height="946" fill="#ece4d8"/>
  <g class="on-light">
  <g transform="translate(48,1266)">
    <text x="0" y="0" class="brow">ПРИГЛАСИТЬ</text>
    <rect x="0" y="14" width="390" height="844" rx="46" fill="#f5efe4" stroke="#221a12" stroke-width="1"/>
    <g transform="translate(8,22)">
      <rect x="0" y="0" width="374" height="828" rx="35" fill="#ece4d8"/>
      <text x="187" y="30" class="mono" text-anchor="middle">9:41</text>
      <text x="20" y="64" class="disp" font-size="20">пригласить</text>
      <text x="20" y="84" class="mono">за пределами альфы</text>
      <line x1="0" y1="104" x2="374" y2="104" stroke="#221a12" stroke-width="1"/>
      <rect x="16" y="140" width="342" height="96" rx="16" fill="#ddd0bd" stroke="#221a12" stroke-width="1"/>
      <text x="32" y="168" class="brow">ВАША ССЫЛКА</text>
      <text x="32" y="200" class="msg">sosed.place/i/8f4c1a</text>
      <rect x="16" y="256" width="342" height="44" rx="12" fill="#bd4b2a"/>
      <text x="187.0" y="284" class="small" style="fill:#fff6f0;font-weight:700" text-anchor="middle">Скопировать</text>
      <rect x="16" y="330" width="342" height="140" rx="16" fill="#f5efe4" stroke="#221a12" stroke-width="1"/>
      <text x="32" y="358" class="brow">ЧТО ПОЛУЧАЮТ ОБА</text>
      <text x="32" y="386" class="msg">Приглашённый заходит по ссылке</text>
      <text x="32" y="406" class="msg">и регистрируется — поощрение</text>
      <text x="32" y="426" class="msg">получают оба.</text>
      <text x="32" y="456" class="warn">размер поощрения не определён</text>
      <text x="16" y="520" class="mono">не входит в day0 и альфу — механика описана,</text>
      <text x="16" y="538" class="mono">чтобы её было куда встроить, когда придёт время</text>
    </g>
  </g>
  </g>
    <g transform="translate(525,256)">
      <rect x="0" y="0" width="867" height="176" rx="16" fill="#17130f" stroke="#e0973a" stroke-width="2"/>
      <text x="24" y="30" class="brow">ОТКРЫТОЕ, ИЗ ОПИСАНИЯ ЭКРАНА</text>
      <text x="24" y="56" class="warn">Четыре вопроса описание оставляет открытыми.</text>
      <text x="24" y="80" class="body">Размер поощрения не определён.</text>
      <text x="24" y="104" class="body">Откуда человек берёт свою ссылку — не определено. Здесь она на своём экране.</text>
      <text x="24" y="128" class="body">Ограничение на число приглашений не определено.</text>
      <text x="24" y="152" class="body">Момент начисления не определён: сразу при регистрации или по условию.</text>
    </g>
    <g transform="translate(48,2228)">
      <rect x="0" y="-8" width="1344" height="36" rx="10" fill="#241c14" stroke="#3a2e20" stroke-width="1"/>
      <text x="24" y="16" class="mono">Цвета — landing/index.html, шрифт — landing/fonts.css. Брат: neighbro.place/design/interface/</text>
    </g>
</svg>
