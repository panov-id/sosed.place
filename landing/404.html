<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; base-uri 'self'; form-action 'none'; object-src 'none'">
<title>sosed — not found</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
<meta name="theme-color" content="#0d0b0a">
<link rel="stylesheet" href="/fonts.css">
<style>
  :root{--bg:#0d0b0a;--panel:#17130f;--border:#3a2e20;--fg:#f0e7dc;--muted:#9a8d7c;--accent:#d6552f;--accent-ink:#fff6f0;
        --sans:"Golos Text",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
        --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace}
  @media (prefers-color-scheme: light){
    :root{--bg:#ece4d8;--panel:#f5efe4;--border:#221a12;--fg:#1c140d;--muted:#6b5f4c}
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
       background:var(--bg);color:var(--fg);font-family:var(--sans)}
  .card{max-width:460px;text-align:center}
  .code{font-family:var(--mono);font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
  h1{font-size:clamp(1.6rem,5vw,2.4rem);line-height:1.15;margin:.6rem 0 .8rem}
  p{color:var(--muted);margin:0 0 1.6rem}
  a.home{display:inline-block;background:var(--accent);color:var(--accent-ink);text-decoration:none;
         padding:12px 22px;border-radius:10px;font-weight:600}
  a.home:hover{filter:brightness(1.08)}
</style>
</head>
<body>
  <div class="card">
    <div class="code">404</div>
    <h1>Nobody lives at this address.</h1>
    <p>The page moved, or never existed. The neighbors are all back on the main page.</p>
    <a class="home" href="/">Go home</a>
  </div>
</body>
</html>
